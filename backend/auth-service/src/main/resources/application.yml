mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false

app:
  id: ${APP_ID:auth-service}

# Datasource, Redis, JWT, session, Eureka and management settings are loaded
# from Apollo. Only Apollo bootstrap values remain local.
apollo:
  meta: ${APOLLO_META:http://localhost:8080}
  required: ${APOLLO_REQUIRED:true}
  bootstrap:
    enabled: ${APOLLO_ENABLED:true}
    eagerLoad:
      enabled: true
    namespaces: ${APOLLO_NAMESPACES:application,database,security}
