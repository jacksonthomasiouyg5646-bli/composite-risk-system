services:
  mysql:
    image: mysql:9.4
    container_name: ${CONTAINER_PREFIX:-risk}-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: user_management
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:?Set a BCrypt admin password hash in .env}
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - risk_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/02-bootstrap-admin.sh:/docker-entrypoint-initdb.d/02-bootstrap-admin.sh:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: ${CONTAINER_PREFIX:-risk}-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    expose:
      - "6379"
    volumes:
      - risk_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-namesrv:
    image: local/rocketmq:5.5.0
    container_name: ${CONTAINER_PREFIX:-risk}-rocketmq-namesrv
    command: ["sh", "bin/mqnamesrv"]
    expose:
      - "9876"

  rocketmq-broker:
    image: local/rocketmq:5.5.0
    container_name: ${CONTAINER_PREFIX:-risk}-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    command: ["sh", "bin/mqbroker", "-c", "/opt/rocketmq/conf/broker-docker.conf"]
    volumes:
      - ./docker/rocketmq/broker.conf:/opt/rocketmq/conf/broker-docker.conf:ro
      - risk_rocketmq_store:/home/rocketmq/store
    expose:
      - "10909"
      - "10911"

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: ${CONTAINER_PREFIX:-risk}-rocketmq-dashboard
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Dserver.port=8082 -Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    ports:
      - "127.0.0.1:8082:8082"

  log-viewer:
    image: amir20/dozzle:latest
    container_name: ${CONTAINER_PREFIX:-risk}-log-viewer
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_LEVEL: info
      DOZZLE_TIMEOUT: 60s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9999:8080"

  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: ${CONTAINER_PREFIX:-risk}-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - risk_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:10.4.3
    container_name: ${CONTAINER_PREFIX:-risk}-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - risk_grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  discovery-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: discovery-server
    image: risk/discovery-server:1.0.0
    container_name: ${CONTAINER_PREFIX:-risk}-discovery-server
    environment:
      APOLLO_ENABLED: ${APOLLO_ENABLED:-true}
      APOLLO_REQUIRED: ${APOLLO_REQUIRED:-true}
      APOLLO_META: ${APOLLO_META:-http://host.docker.internal:8080}
      APOLLO_NAMESPACES: application
      LOG_DIR: /var/log/risk
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
    volumes:
      - risk_app_logs:/var/log/risk
    expose:
      - "8761"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 30

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    image: risk/api-gateway:1.0.0
    container_name: ${CONTAINER_PREFIX:-risk}-api-gateway
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APOLLO_ENABLED: ${APOLLO_ENABLED:-true}
      APOLLO_REQUIRED: ${APOLLO_REQUIRED:-true}
      APOLLO_META: ${APOLLO_META:-http://host.docker.internal:8080}
      APOLLO_NAMESPACES: application,gateway,security
      LOG_DIR: /var/log/risk
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
    volumes:
      - risk_app_logs:/var/log/risk
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8088}:8088"

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    image: risk/auth-service:1.0.0
    container_name: ${CONTAINER_PREFIX:-risk}-auth-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      APOLLO_ENABLED: ${APOLLO_ENABLED:-true}
      APOLLO_REQUIRED: ${APOLLO_REQUIRED:-true}
      APOLLO_META: ${APOLLO_META:-http://host.docker.internal:8080}
      APOLLO_NAMESPACES: application,database,security
      LOG_DIR: /var/log/risk
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
    volumes:
      - risk_app_logs:/var/log/risk
    expose:
      - "9001"

  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    image: risk/user-service:1.0.0
    container_name: ${CONTAINER_PREFIX:-risk}-user-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      APOLLO_ENABLED: ${APOLLO_ENABLED:-true}
      APOLLO_REQUIRED: ${APOLLO_REQUIRED:-true}
      APOLLO_META: ${APOLLO_META:-http://host.docker.internal:8080}
      APOLLO_NAMESPACES: application,database,security
      LOG_DIR: /var/log/risk
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
    volumes:
      - risk_app_logs:/var/log/risk
    expose:
      - "9002"

  system-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: system-service
    image: risk/system-service:1.0.0
    container_name: ${CONTAINER_PREFIX:-risk}-system-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    environment:
      APOLLO_ENABLED: ${APOLLO_ENABLED:-true}
      APOLLO_REQUIRED: ${APOLLO_REQUIRED:-true}
      APOLLO_META: ${APOLLO_META:-http://host.docker.internal:8080}
      APOLLO_NAMESPACES: application,database,security,risk,mq
      LOG_DIR: /var/log/risk
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
    volumes:
      - risk_app_logs:/var/log/risk
    expose:
      - "9003"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: risk/frontend:1.0.0
    container_name: ${CONTAINER_PREFIX:-risk}-frontend
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      GATEWAY_HOST: api-gateway
      GATEWAY_PORT: 8088
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:5173:80"

volumes:
  risk_mysql_data:
  risk_redis_data:
  risk_app_logs:
  risk_prometheus_data:
  risk_grafana_data:
  risk_rocketmq_store:
