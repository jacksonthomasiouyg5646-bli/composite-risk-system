global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: risk-discovery-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - discovery-server:8761
        labels:
          application: discovery-server

  - job_name: risk-api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8088
        labels:
          application: api-gateway

  - job_name: risk-auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:9001
        labels:
          application: auth-service

  - job_name: risk-user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user-service:9002
        labels:
          application: user-service

  - job_name: risk-system-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - system-service:9003
        labels:
          application: system-service
