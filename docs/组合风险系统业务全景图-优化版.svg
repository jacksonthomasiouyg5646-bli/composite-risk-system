<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203247}.title{font-size:34px;font-weight:700}.sub{font-size:15px;fill:#60758b}.h{font-size:20px;font-weight:700}.sh{font-size:16px;font-weight:700}.t{font-size:14px}.s{font-size:12px;fill:#52677c}.box{fill:#fff;stroke:#c9d7e5;stroke-width:1.5}.blue{fill:#eaf3fb;stroke:#4381ad}.green{fill:#eaf7f2;stroke:#329274}.orange{fill:#fff3e5;stroke:#da8629}.red{fill:#fceceb;stroke:#c7524b}.gray{fill:#f3f6f9;stroke:#c8d5e2}.purple{fill:#f2effa;stroke:#7769a8}.arrow{stroke:#758da3;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#758da3;stroke-width:1.6;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#758da3"/></marker></defs>
<rect width="1800" height="1120" fill="#f7f9fc"/>
<text x="45" y="48" class="title">组合风险系统业务全景图（优化版）</text>
<text x="45" y="76" class="sub">以风险偏好为起点，以月末组合分析和日常预警处置为双主线，将风险计量转化为可执行的管理决策</text>
<g class="s"><rect x="1440" y="26" width="70" height="24" rx="4" class="blue"/><text x="1475" y="43" text-anchor="middle">业务分析</text><rect x="1520" y="26" width="70" height="24" rx="4" class="green"/><text x="1555" y="43" text-anchor="middle">正常完成</text><rect x="1600" y="26" width="70" height="24" rx="4" class="orange"/><text x="1635" y="43" text-anchor="middle">关注预警</text><rect x="1680" y="26" width="70" height="24" rx="4" class="red"/><text x="1715" y="43" text-anchor="middle">高风险</text></g>

<rect x="40" y="100" width="1720" height="92" rx="8" class="box"/><text x="60" y="130" class="h">一、组合风险管理目标与风险偏好</text>
<g class="t" text-anchor="middle"><rect x="300" y="121" width="185" height="48" rx="6" class="blue"/><text x="392" y="150">资产质量保持稳定</text><rect x="510" y="121" width="185" height="48" rx="6" class="blue"/><text x="602" y="150">控制集中度与尾部风险</text><rect x="720" y="121" width="185" height="48" rx="6" class="green"/><text x="812" y="150">平衡风险、收益与资本</text><rect x="930" y="121" width="185" height="48" rx="6" class="orange"/><text x="1022" y="150">提前识别组合风险恶化</text><rect x="1140" y="121" width="185" height="48" rx="6" class="red"/><text x="1232" y="150">防止限额与损失突破</text><rect x="1350" y="121" width="185" height="48" rx="6" class="purple"/><text x="1442" y="150">支持投向与资源配置</text></g>
<text x="60" y="174" class="s">风险偏好 → 组合目标 → 行业/产品/机构/集团限额 → 日常监测 → 超限处置 → 定期评价</text>

<rect x="40" y="215" width="295" height="610" rx="8" class="box"/><text x="60" y="248" class="h">二、信贷业务与风险数据</text>
<g class="t" text-anchor="middle"><rect x="65" y="275" width="115" height="45" rx="6" class="blue"/><text x="122" y="303">集团与关联方</text><rect x="195" y="275" width="115" height="45" rx="6" class="blue"/><text x="252" y="303">客户主数据</text><rect x="65" y="345" width="115" height="45" rx="6" class="blue"/><text x="122" y="373">评级信息</text><rect x="195" y="345" width="115" height="45" rx="6" class="blue"/><text x="252" y="373">授信额度</text><rect x="98" y="415" width="180" height="45" rx="6" class="blue"/><text x="188" y="443">业务申请</text><rect x="98" y="485" width="180" height="45" rx="6" class="blue"/><text x="188" y="513">信贷合同</text><rect x="65" y="555" width="115" height="45" rx="6" class="blue"/><text x="122" y="583">债项支用</text><rect x="195" y="555" width="115" height="45" rx="6" class="green"/><text x="252" y="583">押品与担保</text><rect x="65" y="625" width="115" height="45" rx="6" class="orange"/><text x="122" y="653">逾期信息</text><rect x="195" y="625" width="115" height="45" rx="6" class="red"/><text x="252" y="653">违约与损失</text></g>
<path d="M180 297H195M252 320V345M195 367H180M252 390L205 415M188 460V485M188 530L135 555M188 530L240 555M122 600V625M180 647H195" class="arrow"/>
<rect x="65" y="700" width="245" height="94" rx="6" class="gray"/><text x="80" y="727" class="sh">集团风险关系</text><text x="80" y="751" class="s">股权控制、共同实际控制人、担保关系</text><text x="80" y="773" class="s">关联交易、集团统一授信、风险传染路径</text>

<rect x="360" y="215" width="630" height="610" rx="8" class="box"/><text x="380" y="248" class="h">三、双运行主线</text>
<rect x="385" y="275" width="580" height="235" rx="8" fill="#eef5fb" stroke="#4381ad"/><text x="405" y="305" class="sh">主线 A：月末批量分析</text><text x="405" y="328" class="s">用于正式组合风险计量、跨月比较和管理报告</text>
<g class="t" text-anchor="middle"><rect x="405" y="355" width="120" height="52" rx="6" class="blue"/><text x="465" y="378">上游数据接收</text><text x="465" y="396" class="s">批次与清单</text><rect x="545" y="355" width="120" height="52" rx="6" class="orange"/><text x="605" y="378">质量与勾稽</text><text x="605" y="396" class="s">关联完整性</text><rect x="685" y="355" width="120" height="52" rx="6" class="green"/><text x="745" y="378">月末快照</text><text x="745" y="396" class="s">客户与债项</text><rect x="825" y="355" width="120" height="52" rx="6" class="green"/><text x="885" y="378">发布与锁定</text><text x="885" y="396" class="s">版本与重算</text></g><path d="M525 381H545M665 381H685M805 381H825" class="arrow"/>
<rect x="405" y="430" width="540" height="55" rx="6" class="blue"/><text x="675" y="454" text-anchor="middle" class="t">跨月组合分析：规模变化、评级迁徙、PD/LGD/EAD/EL变化、逾期与违约变化</text><text x="675" y="474" text-anchor="middle" class="s">组合 → 行业 → 集团 → 客户 → 合同 → 债项逐级下钻</text>

<rect x="385" y="535" width="580" height="260" rx="8" fill="#fff7ec" stroke="#d9872d"/><text x="405" y="565" class="sh">主线 B：日常风险预警与处置</text><text x="405" y="588" class="s">用于发现风险信号、推动整改和评价处置效果</text>
<g class="t" text-anchor="middle"><rect x="405" y="615" width="120" height="48" rx="24" class="orange"/><text x="465" y="644">风险信号识别</text><rect x="545" y="615" width="120" height="48" rx="24" class="red"/><text x="605" y="644">预警案件</text><rect x="685" y="615" width="120" height="48" rx="24" class="orange"/><text x="745" y="644">整改任务</text><rect x="825" y="615" width="120" height="48" rx="24" class="green"/><text x="885" y="644">处置与复核</text><rect x="825" y="700" width="120" height="48" rx="24" class="blue"/><text x="885" y="729">效果评价</text><rect x="685" y="700" width="120" height="48" rx="24" class="purple"/><text x="745" y="729">规则优化</text><rect x="545" y="700" width="120" height="48" rx="24" class="blue"/><text x="605" y="729">状态回写</text><rect x="405" y="700" width="120" height="48" rx="24" class="gray"/><text x="465" y="729">台账与指标同步</text></g>
<path d="M525 639H545M665 639H685M805 639H825M885 663V700M825 724H805M685 724H665M545 724H525M465 700V663" class="arrow"/>
<path d="M335 515H360" class="arrow"/>

<rect x="1015" y="215" width="350" height="610" rx="8" class="box"/><text x="1035" y="248" class="h">四、风险计量与组合管理</text>
<rect x="1100" y="285" width="180" height="80" rx="8" class="blue"/><text x="1190" y="318" text-anchor="middle" class="h">风险敞口</text><text x="1190" y="345" text-anchor="middle" class="s">统一计量与分析基础</text>
<g class="t" text-anchor="middle"><rect x="1040" y="390" width="135" height="48" rx="6" class="orange"/><text x="1107" y="419">PD 违约概率</text><rect x="1205" y="390" width="135" height="48" rx="6" class="orange"/><text x="1272" y="419">LGD 损失率</text><rect x="1040" y="460" width="135" height="48" rx="6" class="green"/><text x="1107" y="489">EAD 风险暴露</text><rect x="1205" y="460" width="135" height="48" rx="6" class="green"/><text x="1272" y="489">EL 预期损失</text></g>
<path d="M1107 390L1150 365M1272 390L1230 365" class="arrow"/>
<text x="1035" y="550" class="sh">组合管理工具</text><g class="t" text-anchor="middle"><rect x="1040" y="570" width="135" height="46" rx="6" class="blue"/><text x="1107" y="598">集中度分析</text><rect x="1205" y="570" width="135" height="46" rx="6" class="green"/><text x="1272" y="598">风险偏好与限额</text><rect x="1040" y="635" width="135" height="46" rx="6" class="orange"/><text x="1107" y="663">下月占用预测</text><rect x="1205" y="635" width="135" height="46" rx="6" class="red"/><text x="1272" y="663">预警与超限</text><rect x="1040" y="700" width="135" height="46" rx="6" class="orange"/><text x="1107" y="728">压力测试</text><rect x="1205" y="700" width="135" height="46" rx="6" class="purple"/><text x="1272" y="728">模型回溯校准</text></g>
<rect x="1040" y="765" width="300" height="38" rx="5" class="gray"/><text x="1190" y="789" text-anchor="middle" class="s">行业、产品、机构、区域、集团、评级、期限</text><path d="M990 515H1015" class="arrow"/>

<rect x="1390" y="215" width="370" height="610" rx="8" class="box"/><text x="1410" y="248" class="h">五、管理决策、输出与角色</text>
<text x="1410" y="285" class="sh">风险分析转化为业务动作</text><g class="t"><rect x="1410" y="305" width="155" height="44" rx="6" class="blue"/><text x="1430" y="332">调整行业和区域投向</text><rect x="1580" y="305" width="155" height="44" rx="6" class="red"/><text x="1600" y="332">压降高风险敞口</text><rect x="1410" y="365" width="155" height="44" rx="6" class="orange"/><text x="1430" y="392">收紧、冻结或释放额度</text><rect x="1580" y="365" width="155" height="44" rx="6" class="green"/><text x="1600" y="392">增补押品与担保</text><rect x="1410" y="425" width="155" height="44" rx="6" class="blue"/><text x="1430" y="452">调整定价、期限和条件</text><rect x="1580" y="425" width="155" height="44" rx="6" class="red"/><text x="1600" y="452">限制或退出高风险客户</text></g>
<text x="1410" y="510" class="sh">管理输出</text><g class="t" text-anchor="middle"><rect x="1410" y="530" width="155" height="46" rx="6" class="blue"/><text x="1487" y="558">组合风险驾驶舱</text><rect x="1580" y="530" width="155" height="46" rx="6" class="blue"/><text x="1657" y="558">月末变动报告</text><rect x="1410" y="590" width="155" height="46" rx="6" class="green"/><text x="1487" y="618">客户与集团画像</text><rect x="1580" y="590" width="155" height="46" rx="6" class="orange"/><text x="1657" y="618">管理与监管报表</text></g>
<text x="1410" y="675" class="sh">主要使用角色</text><g class="s" text-anchor="middle"><rect x="1410" y="695" width="72" height="36" rx="18" class="purple"/><text x="1446" y="718">管理层</text><rect x="1492" y="695" width="72" height="36" rx="18" class="blue"/><text x="1528" y="718">风险经理</text><rect x="1574" y="695" width="72" height="36" rx="18" class="green"/><text x="1610" y="718">业务机构</text><rect x="1656" y="695" width="72" height="36" rx="18" class="orange"/><text x="1692" y="718">模型人员</text><rect x="1450" y="750" width="110" height="36" rx="18" class="gray"/><text x="1505" y="773">数据管理人员</text><rect x="1580" y="750" width="110" height="36" rx="18" class="gray"/><text x="1635" y="773">审计合规人员</text></g><path d="M1365 515H1390" class="arrow"/>

<rect x="40" y="850" width="1720" height="105" rx="8" fill="#edf4ff" stroke="#4d78b5" stroke-width="1.5"/><text x="60" y="882" class="h">六、AI 智能风险能力（贯穿全流程）</text>
<g class="t" text-anchor="middle"><rect x="340" y="872" width="160" height="52" rx="6" class="blue"/><text x="420" y="903">自然语言查询与问数</text><rect x="515" y="872" width="160" height="52" rx="6" class="blue"/><text x="595" y="903">客户与集团智能画像</text><rect x="690" y="872" width="160" height="52" rx="6" class="orange"/><text x="770" y="903">异常识别与风险预警</text><rect x="865" y="872" width="160" height="52" rx="6" class="orange"/><text x="945" y="903">跨月变化智能归因</text><rect x="1040" y="872" width="160" height="52" rx="6" class="green"/><text x="1120" y="903">处置建议与报告生成</text><rect x="1215" y="872" width="160" height="52" rx="6" class="green"/><text x="1295" y="903">外部大数据辅助分析</text><rect x="1390" y="872" width="160" height="52" rx="6" class="purple"/><text x="1470" y="903">模型与规则辅助优化</text></g>
<text x="60" y="938" class="s">治理边界：AI仅提供辅助分析；核心结论可解释、数据来源可追溯、敏感数据受控，正式处置和模型发布必须经过人工复核与授权。</text>

<rect x="40" y="980" width="410" height="100" rx="8" class="gray"/><text x="245" y="1012" text-anchor="middle" class="sh">数据质量与业务口径</text><text x="245" y="1038" text-anchor="middle" class="s">标准、血缘、完整性、唯一性、关联性</text><text x="245" y="1060" text-anchor="middle" class="s">勾稽、整改、SLA与批次验收</text>
<rect x="475" y="980" width="410" height="100" rx="8" class="gray"/><text x="680" y="1012" text-anchor="middle" class="sh">模型生命周期与验证</text><text x="680" y="1038" text-anchor="middle" class="s">开发、模拟、审批、发布、监控、回滚</text><text x="680" y="1060" text-anchor="middle" class="s">区分度、校准度、稳定性与回溯检验</text>
<rect x="910" y="980" width="410" height="100" rx="8" class="gray"/><text x="1115" y="1012" text-anchor="middle" class="sh">权限、安全与合规</text><text x="1115" y="1038" text-anchor="middle" class="s">机构隔离、字段权限、脱敏、导出控制</text><text x="1115" y="1060" text-anchor="middle" class="s">双人复核、审计日志与操作留痕</text>
<rect x="1345" y="980" width="415" height="100" rx="8" class="gray"/><text x="1552" y="1012" text-anchor="middle" class="sh">后续扩展能力</text><text x="1552" y="1038" text-anchor="middle" class="s">IFRS 9/ECL、RWA、经济资本、RAROC</text><text x="1552" y="1060" text-anchor="middle" class="s">宏观情景、监管报送与高可用运行</text>
</svg>
